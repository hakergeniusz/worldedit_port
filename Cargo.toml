[package]
name = "worldedit_port"
version = "1.3.0"
edition = "2024"
license = "MIT"
description = "WorldEdit for Horizon: an in-game block editor with the wooden-axe wand, regions, shapes, schematics and a schematics menu, driven by // commands."
publish = false

# The launcher's staged build calls this crate's brain by its library name;
# the helpers reach it as `worldedit::`.
[lib]
name = "worldedit"

[dependencies]
# The pinned SDK's API crate; the launcher stages its own copy of the same build.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "0.4"
