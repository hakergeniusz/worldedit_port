id = "worldedit"
name = "WorldEdit"
version = "1.3.1"
description = "WorldEdit as a Horizon native mod: // commands build with regions, shapes and patterns, the wooden-axe wand picks corners, and //schem opens a schematics menu over the pause screen. A migration of XnotCykoX's WorldEdit-Horizon."
authors = ["hakergeniusz"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]

[native]
game = "26.3"
horizon = "f037744a79f9982c47876f49c5a3067279f88706"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

# A command typed here (single player, in frame, or the machine hosting a LAN
# world), before the game parses it. The whole editor — commands, patterns,
# masks, shapes, clipboard, history and the schematic files — lives in this
# helper, nested inside the one hook that reaches it; every edit goes out
# through `Game::level_set` (the `/setblock` path), so no command or packet
# limit applies.
[[native.mixin]]
id = "command"
target = "horizon_client::game::commands::Game<'_>::run_command"
kind = "HEAD"
cancellable = true
helper = "src/mixins/command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "command", ty = "&str", value = "command" },
]

# A command from a guest of a hosted world: queued unmodified, so the server
# runs it with that player's state in place (`as_guest`).
[[native.mixin]]
id = "guest-command"
target = "horizon_client::game::lan_actions::commands::Game<'_>::guest_command"
kind = "HEAD"
cancellable = true
helper = "src/mixins/guest_command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "conn", ty = "u32", value = "conn" },
  { name = "command", ty = "&str", value = "command" },
]

# `//schem` typed in chat: a window over its own world opens the menu before
# the line goes to the server.
[[native.mixin]]
id = "schem-input"
target = "horizon_client::game::chat::Game<'_>::handle_chat_input"
kind = "HEAD"
cancellable = true
helper = "src/mixins/schem_input.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "message", ty = "&str", value = "message" },
]

# The menu draws itself over the pause menu's screen (Screen::Paused with
# `pause_menu` set): its draw hands over while a menu is open, and the pause
# menu keeps its own draw otherwise.
[[native.mixin]]
id = "schem-draw"
target = "horizon_client::game::screens::Game<'_>::draw_pause_menu"
kind = "HEAD"
cancellable = true
helper = "src/mixins/schem_draw.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "batch" },
]

# A left click while the menu is up is the menu's: the pause menu's buttons
# are not under it.
[[native.mixin]]
id = "schem-click"
target = "horizon_client::game::screens::Game<'_>::pause_click"
kind = "HEAD"
cancellable = true
helper = "src/mixins/schem_click.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

# Keys while the menu is up: Esc closes it, Enter loads the pick, the arrows
# and paging move through the list, and nothing else reaches the game.
[[native.mixin]]
id = "schem-key"
target = "horizon_client::game::play_keys::Game<'_>::key_pressed"
kind = "HEAD"
cancellable = true
helper = "src/mixins/schem_key.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "key", ty = "winit::keyboard::KeyCode", value = "key" },
]

# Entering a world makes its `schematics/` folder and notes the world, so the
# folder is there to drag files into and the completions would list it.
[[native.mixin]]
id = "open-world"
target = "horizon_client::game::world_session::Game<'_>::open_world"
kind = "HEAD"
helper = "src/mixins/open_world.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "folder", ty = "&str", value = "folder" },
]

# The wand: left click sets position 1, right click position 2, while the
# wooden axe `//wand` gave is held. The click is taken before the game starts
# mining or using an item.
[[native.mixin]]
id = "wand"
target = "horizon_client::game::play_input::Game<'_>::play_mouse"
kind = "HEAD"
cancellable = true
helper = "src/mixins/wand.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "button", ty = "winit::event::MouseButton", value = "button" },
  { name = "pressed", ty = "bool", value = "pressed" },
]
